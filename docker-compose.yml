version: '3.8'

services:
  # Interface Intranet
  intranet:
    build: .
    ports:
      - "8081:80"
    depends_on:
      - keycloak
      - nextcloud
      - grafana
      - prometheus
    networks:
      - intranet-network

  # Keycloak pour l'authentification SSO
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY: edge
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_HOST: keycloak
      KC_HTTP_PORT: 8080
      KC_IMPORT: /opt/keycloak/data/import/realm-export.json
    command: start-dev
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-realm:/opt/keycloak/data/import
    depends_on:
      - postgres
    networks:
      - intranet-network

  # Base de données pour Keycloak
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - intranet-network

  # Nextcloud
  nextcloud:
    image: nextcloud:latest
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=password
      - NEXTCLOUD_TRUSTED_DOMAINS=nextcloud.monentreprise.local
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=admin
      - OVERWRITEPROTOCOL=http
    volumes:
      - nextcloud_data:/var/www/html
    depends_on:
      - mysql
    networks:
      - intranet-network

  # MySQL pour Nextcloud
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - intranet-network

  # Grafana
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=intranet-client
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=your-client-secret
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=http://localhost:8080/auth/realms/intranet/protocol/openid-connect/auth
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=http://localhost:8080/auth/realms/intranet/protocol/openid-connect/token
      - GF_SERVER_ROOT_URL=http://localhost:8081/grafana
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - intranet-network

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.external-url=http://localhost:8081/prometheus'
    networks:
      - intranet-network

networks:
  intranet-network:
    driver: bridge

volumes:
  postgres_data:
  mysql_data:
  nextcloud_data:
  grafana_data:
  prometheus_data: 
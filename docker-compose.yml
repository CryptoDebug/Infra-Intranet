version: '3.8'

services:
  # OpenLDAP
  ldap:
    image: osixia/openldap:latest
    container_name: ldap
    environment:
      LDAP_ORGANISATION: "Mon Entreprise"
      LDAP_DOMAIN: "monentreprise.local"
      LDAP_ADMIN_PASSWORD: "admin_password"
      LDAP_BASE_DN: "dc=monentreprise,dc=local"
    volumes:
      - ./config/ldap:/etc/ldap/slapd.d
      - ldap_data:/var/lib/ldap
    ports:
      - "389:389"
      - "636:636"
    networks:
      - intranet_network

  # Nextcloud
  nextcloud:
    image: nextcloud:25.0.12
    container_name: nextcloud
    depends_on:
      - ldap
      - db
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloud_password
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin_password
      NEXTCLOUD_TRUSTED_DOMAINS: nextcloud.monentreprise.local
    volumes:
      - nextcloud_data:/var/www/html
    networks:
      - intranet_network

  # Base de données
  db:
    image: mariadb:10.6
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloud_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - intranet_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - nextcloud
    networks:
      - intranet_network

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./config/monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    networks:
      - intranet_network

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin_password
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - intranet_network

volumes:
  ldap_data:
  nextcloud_data:
  db_data:
  prometheus_data:
  grafana_data:

networks:
  intranet_network:
    driver: bridge 